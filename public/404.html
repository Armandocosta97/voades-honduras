<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>VOADES Honduras</title>
    <script type="text/javascript">
      // This site uses HashRouter, so the only real route is the base URL
      // itself; anything after "#" is handled entirely client-side and
      // never reaches the server. GitHub Pages serves this file whenever
      // someone hits a path that isn't the base (e.g. a shared or typed
      // link like "/voades-honduras/about" without the "#"). Instead of
      // 404ing, turn the extra path back into the equivalent hash route.
      var base = '/voades-honduras/'
      var rest = window.location.pathname.slice(base.length)
      window.location.replace(
        base + '#/' + rest + window.location.search + window.location.hash,
      )
    </script>
  </head>
  <body></body>
</html>
